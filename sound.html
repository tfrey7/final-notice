<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Notice - Sound Test</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #fcfcfc; }
    body {
      font: 16px/24px "Courier New", ui-monospace, monospace; font-weight: bold;
      text-transform: uppercase; letter-spacing: 1px; display: grid; place-items: start center;
      padding: 32px 16px;
    }
    .box {
      width: min(512px, 100%); box-sizing: border-box; background: #0000a8;
      border: 4px solid #fcfcfc; box-shadow: 0 0 0 4px #0000a8, 0 0 0 8px #fcfcfc;
      padding: 16px 24px; margin: 8px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; color: #fcbcb0; text-align: center; }
    h2 { font-size: 16px; margin: 16px 0 0; color: #3cbcfc; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { cursor: pointer; padding-left: 24px; position: relative; }
    li.sel::before { content: "\25B6"; position: absolute; left: 0; color: #f8b800; }
    li.playing { color: #b8f818; }
    #prompt { text-align: center; color: #f8b800; }
    #prompt.go { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { visibility: hidden; } }
    .meters { display: grid; grid-template-columns: 7em 1fr 3.5em; gap: 4px 8px; align-items: center; }
    .bar { height: 16px; background: #000; border: 2px solid #fcfcfc; }
    .bar i { display: block; height: 100%; width: 0; background: #b8f818; }
    .bar i.sfx { background: #f83800; }
    .help { color: #bcbcbc; font-size: 14px; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Sound Test</h1>
    <div id="prompt" class="go">Click or press a key</div>
    <h2>Music</h2>
    <ul id="songs"></ul>
    <h2>Effects</h2>
    <ul id="effects"></ul>
    <h2 id="chip">2A03 + VRC6 + DPCM</h2>
    <div class="meters" id="meters"></div>
    <div class="help">Up/Down select - Z or Enter play - X stop</div>
  </div>
  <script type="module">
    // ?snes plays the SNES sound chip instead of the NES one.
    const snes = new URLSearchParams(location.search).has('snes');
    const { playSong, stopSong, sfx, hasSong, unlocked, currentSong, channelStatus } =
      await import(snes ? './src/snes/audio/player.mjs' : './src/audio/player.mjs');
    const { SFX } = await import(snes ? './src/snes/audio/player.mjs' : './src/audio/sfx.mjs');
    const { SFX_V1 } = snes ? { SFX_V1: {} } : await import('./src/audio/sfx-v1.mjs');
    if (snes) {
      document.getElementById('chip').textContent = 'S-SMP: SPC700 + S-DSP';
      document.title += ' (SNES)';
    }

    const CUES = snes ? ['test'] : ['demo', 'title', 'title-v2', 'title-v1', 'scene', 'scene-v1', 'stage1', 'stage1-v1', 'stage2', 'stage2-v1',
      'boss', 'boss-v1', 'ending', 'ending-v1', 'stageStart', 'stageClear', 'lifeLost', 'gameOver', 'continue', 'pickup',
      'stageStart-v1', 'stageClear-v1', 'lifeLost-v1', 'gameOver-v1', 'continue-v1', 'pickup-v1'];
    const label = (name) => name.replace(/-(v\d)$/, ' ($1)');
    const songsEl = document.getElementById('songs');
    const effectsEl = document.getElementById('effects');
    const prompt = document.getElementById('prompt');
    const items = [];
    let sel = 0;

    function add(list, name, play) {
      const li = document.createElement('li');
      li.textContent = label(name);
      li.addEventListener('click', () => { sel = items.findIndex((i) => i.li === li); render(); play(); });
      list.append(li);
      items.push({ li, play, name });
    }

    const found = await Promise.all(CUES.map(async (name) => [name, await hasSong(name)]));
    for (const [name, ok] of found) if (ok) add(songsEl, name, () => playSong(name));
    const songCount = items.length;
    for (const name of Object.keys(SFX)) add(effectsEl, name, () => sfx(name));
    for (const name of Object.keys(SFX_V1)) add(effectsEl, `${name}-v1`, () => sfx(`${name}-v1`));

    const meters = document.getElementById('meters');
    const bars = channelStatus().map(({ channel }) => {
      const label = document.createElement('span');
      label.textContent = channel;
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('i');
      bar.append(fill);
      const who = document.createElement('span');
      meters.append(label, bar, who);
      return { fill, who };
    });

    function render() {
      items.forEach((it, i) => {
        it.li.classList.toggle('sel', i === sel);
        it.li.classList.toggle('playing', i < songCount && it.name === currentSong());
      });
    }

    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') sel = (sel + 1) % items.length;
      else if (e.key === 'ArrowUp') sel = (sel + items.length - 1) % items.length;
      else if (e.key === 'Enter' || e.key === 'z' || e.key === 'Z') items[sel]?.play();
      else if (e.key === 'x' || e.key === 'X') stopSong();
      else return;
      e.preventDefault();
      render();
    });

    function frame() {
      if (unlocked()) {
        prompt.textContent = 'Sound on';
        prompt.classList.remove('go');
      }
      channelStatus().forEach(({ level, owner }, i) => {
        bars[i].fill.style.width = `${Math.min(100, Math.round(level * 250))}%`;
        bars[i].fill.classList.toggle('sfx', owner === 'sfx');
        bars[i].who.textContent = owner;
      });
      render();
      requestAnimationFrame(frame);
    }
    render();
    frame();
  </script>
</body>
</html>
