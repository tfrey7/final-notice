<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Notice - sprites</title>
  <style>
    html, body { margin: 0; background: #05070f; color: #7fd6bf; font: 14px monospace; }
    #game { display: flex; justify-content: center; padding-top: 12px; }
    canvas { image-rendering: pixelated; }
    p { text-align: center; margin: 8px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <p>Ellis Ward: idle, walk, punch1, punch2, punch3, hit</p>
  <p>Security Associate: walk, windup, punch, reel, knockdown, down</p>
  <script src="vendor/phaser-4.2.1.min.js"></script>
  <script type="module">
    /* global Phaser */
    import { WIDTH, HEIGHT, integerZoom } from './src/screen.mjs';
    import { SpritesScene } from './src/sprites.mjs';

    new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: WIDTH,
      height: HEIGHT,
      backgroundColor: '#05070f',
      pixelArt: true,
      roundPixels: true,
      scale: { mode: Phaser.Scale.NONE, zoom: integerZoom(window.innerWidth, window.innerHeight - 60) },
      scene: [SpritesScene],
    });
  </script>
</body>
</html>
