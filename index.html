<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Notice</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; }
    #crt { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
    #crt-toggle {
      position: fixed; right: 12px; bottom: 12px; padding: 4px 10px;
      font: 12px/1.4 monospace; color: #ccc; background: #111; border: 1px solid #333; border-radius: 4px;
      opacity: 0; transition: opacity 0.2s; cursor: pointer;
    }
    #crt-toggle:hover, #crt-toggle:focus-visible { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="vendor/phaser-4.2.1.min.js"></script>
  <script type="module" src="src/main.mjs"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
