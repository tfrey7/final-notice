<!doctype html>
<meta charset="utf-8">
<title>Final Notice SNES HUD and menu mockups</title>
<style>
  body { background: #111; color: #ddd; font: 13px sans-serif; margin: 16px; }
  canvas { image-rendering: pixelated; width: 768px; height: 672px; display: block; }
  figure { margin: 0 0 24px; }
</style>
<body>
<script type="module">
// Mockups for docs/SNES-HUD-MENUS.md section 5, at 256x224 in 15-bit colour over the game's own
// painted backgrounds, using what the SNES has and the NES lacks: per-line gradients (HDMA on the
// fixed colour), translucent panels and shadows (colour math add/sub/half), bevelled multi-shade
// frames, shaded 16-colour art. ?only=0|1|2 shows one. Serve the repo root.
import { WIDTH, HEIGHT } from '../../../src/snes/screen.mjs';
import { rgb15 as c, channels, rgb } from '../../../src/snes/color.mjs';
import { drawString, measure } from '../../../src/snes/text.mjs';
import { bakeScene, composeFrame } from '../../../src/snes/layers.mjs';
import { fromRgba } from '../../../src/snes/fx.mjs';
import { AREAS } from '../../../src/snes/bg/archive.mjs';
import { screens } from '../../../src/snes/bg/ui.mjs';

const clamp = (v) => Math.max(0, Math.min(31, v));
const mix = (a, b, t) => { const A = channels(a); const B = channels(b); return c(...A.map((v, i) => Math.round(v + (B[i] - v) * t))); };
const noise = (x, y) => { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; };

const INK = c(3, 3, 9);
const RED = c(22, 3, 3);
const OUT = c(1, 1, 4);

// The Archive's BG3 is its sub-screen glow, meaningless without the stage's colour math, so it is left out.
function surface(full, camX, drop = []) {
  const scene = { ...full, layers: full.layers.filter((l) => !drop.includes(l.bg)) };
  const rgba = new Uint8ClampedArray(WIDTH * HEIGHT * 4);
  composeFrame(scene, bakeScene(scene), camX, 0, rgba);
  const px = fromRgba(rgba);
  const ok = (i, j) => i >= 0 && j >= 0 && i < WIDTH && j < HEIGHT;
  const fill = (x, y, w, h, col) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (ok(i, j)) px[j * WIDTH + i] = col; };
  // Colour math against a fixed colour: add or subtract, optionally halved.
  const math = (x, y, w, h, col, op, half = false, keep = () => true) => {
    const f = channels(col);
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
      if (!ok(i, j) || !keep(i, j)) continue;
      const k = j * WIDTH + i;
      const m = channels(px[k]);
      px[k] = c(...m.map((v, n) => { const r = op === 'add' ? v + f[n] : v - f[n]; return clamp(half ? r >> 1 : r); }));
    }
  };
  const grad = (x, y, w, h, top, bot) => { for (let j = 0; j < h; j++) fill(x, y + j, w, 1, mix(top, bot, h > 1 ? j / (h - 1) : 0)); };
  const frame = (x, y, w, h, o, l, d) => {
    fill(x + 1, y, w - 2, 1, o); fill(x + 1, y + h - 1, w - 2, 1, o); fill(x, y + 1, 1, h - 2, o); fill(x + w - 1, y + 1, 1, h - 2, o);
    fill(x + 1, y + 1, w - 2, 1, l); fill(x + 1, y + 1, 1, h - 2, l); fill(x + 1, y + h - 2, w - 2, 1, d); fill(x + w - 2, y + 2, 1, h - 3, d);
  };
  const paper = (x, y, w, h, top = c(29, 27, 21), bot = c(24, 21, 15)) => {
    for (let j = 0; j < h; j++) {
      const base = mix(top, bot, j / (h - 1));
      for (let i = 0; i < w; i++) {
        const n = noise(x + i, y + j) % 37;
        fill(x + i, y + j, 1, 1, n === 0 ? mix(base, c(16, 13, 8), 0.35) : n === 1 ? mix(base, c(31, 31, 31), 0.4) : base);
      }
    }
  };
  const text = (t, x, y, col = INK) => drawString(fill, t, x, y, col, null);
  // Gradient lettering: BG3's colour rewritten per line, with a hard shadow.
  const gtext = (t, x, y, top, bot) => {
    drawString(fill, t, x + 1, y + 1, OUT, null);
    drawString((i, j) => fill(i, j, 1, 1, mix(top, bot, Math.min(1, (j - y) / 7))), t, x, y, 0, null);
  };
  // Worn stamp ink: subtract cyan so the paper's own shading shows through as red.
  const stamp = (t, x, y) => {
    const w = measure(t) + 14; const h = 20;
    const mask = new Set();
    for (let i = 0; i < w; i++) for (const j of [0, 1, h - 2, h - 1]) mask.add(`${x + i},${y + j}`);
    for (let j = 0; j < h; j++) for (const i of [0, 1, w - 2, w - 1]) mask.add(`${x + i},${y + j}`);
    drawString((i, j) => mask.add(`${i},${j}`), t, x + 7, y + 6, 0, null);
    for (const k of mask) {
      const [i, j] = k.split(',').map(Number);
      if (noise(i * 3, j) % 6 !== 0) math(i, j, 1, 1, c(4, 22, 24), 'sub');
    }
  };
  const bar = (x, y, w, h, frac, [hi, mid, lo], lost = 0) => {
    fill(x + 1, y, w - 2, 1, OUT); fill(x + 1, y + h - 1, w - 2, 1, OUT); fill(x, y + 1, 1, h - 2, OUT); fill(x + w - 1, y + 1, 1, h - 2, OUT);
    math(x + 1, y + 1, w - 2, h - 2, c(14, 14, 12), 'sub');
    const n = Math.round((w - 2) * frac); const l = Math.round((w - 2) * lost);
    for (let j = 0; j < h - 2; j++) {
      const col = j === 0 ? hi : j < (h - 2) / 2 ? mid : lo;
      fill(x + 1, y + 1 + j, n, 1, col);
      if (l) fill(x + 1 + n, y + 1 + j, l, 1, mix(col, c(31, 31, 31), 0.55));
    }
    for (let i = x + 9; i < x + n; i += 8) fill(i, y + 2, 1, h - 4, mix(lo, OUT, 0.4));
  };
  const bust = (x, y) => {
    grad(x + 2, y + 17, 20, 13, c(9, 9, 16), c(2, 2, 6));
    fill(x + 10, y + 17, 4, 9, c(28, 28, 30)); fill(x + 11, y + 18, 2, 8, c(22, 4, 4));
    fill(x + 7, y + 4, 10, 12, c(24, 17, 12)); fill(x + 7, y + 5, 2, 10, c(29, 22, 16)); fill(x + 14, y + 5, 3, 10, c(17, 11, 8));
    fill(x + 8, y + 15, 8, 2, c(15, 10, 7));
    fill(x + 6, y + 2, 12, 4, c(7, 5, 4)); fill(x + 7, y + 2, 5, 1, c(12, 9, 7));
    fill(x + 9, y + 9, 2, 1, c(4, 3, 3)); fill(x + 13, y + 9, 2, 1, c(4, 3, 3));
  };
  return { px, fill, math, grad, frame, paper, text, gtext, stamp, bar, bust };
}

function hud() {
  const s = surface(AREAS[1].scene, 0, [3]);
  // Portrait in a brass bezel, with a colour-math shadow.
  s.math(10, 10, 28, 28, c(12, 12, 12), 'sub');
  s.grad(8, 8, 28, 28, c(30, 25, 12), c(13, 8, 2));
  s.frame(8, 8, 28, 28, OUT, c(31, 29, 18), c(10, 6, 1));
  s.grad(11, 11, 22, 22, c(6, 9, 18), c(2, 3, 8));
  s.bust(10, 9);
  s.gtext('WARD', 40, 8, c(31, 31, 31), c(17, 22, 31));
  s.bar(40, 19, 70, 9, 4 / 8, [c(31, 22, 18), c(28, 6, 4), c(17, 2, 2)], 1 / 8);
  s.fill(114, 19, 6, 6, c(24, 17, 12)); s.fill(114, 19, 6, 2, c(7, 5, 4)); s.fill(113, 25, 8, 3, c(6, 6, 12));
  s.gtext('x3', 123, 19, c(31, 31, 31), c(17, 22, 31));
  s.gtext('NOTICE', 140, 8, c(31, 29, 14), c(26, 15, 2));
  for (let i = 0; i < 4; i++) {
    const x = 140 + i * 15; const y = 19;
    if (i < 2) {
      s.grad(x + 1, y + 1, 11, 7, c(31, 28, 12), c(21, 13, 2));
      s.frame(x, y, 13, 9, OUT, c(31, 31, 22), c(16, 9, 1));
      s.math(x + 4, y + 3, 5, 3, c(4, 20, 8), 'sub');
    } else {
      s.frame(x, y, 13, 9, OUT, c(10, 10, 12), c(3, 3, 5));
      s.math(x + 2, y + 2, 9, 5, c(12, 12, 12), 'sub');
    }
  }
  // A receipt on pickup: paper tab with a translucent carbon copy behind it.
  s.math(203, 11, 50, 18, c(10, 10, 10), 'sub');
  s.math(200, 5, 50, 18, c(6, 12, 31), 'add', true);
  s.paper(200, 8, 50, 18);
  s.frame(200, 8, 50, 18, c(10, 8, 5), c(31, 31, 28), c(19, 16, 10));
  s.text('RCPT', 204, 13);
  s.text('12', 236, 13, RED);
  const label = 'OVERDUE: MR VELLUM';
  s.gtext(label, WIDTH - 9 - measure(label), 36, c(31, 26, 31), c(20, 9, 24));
  s.bar(WIDTH - 112, 47, 104, 8, 0.7, [c(29, 20, 31), c(20, 4, 22), c(10, 1, 12)]);
  for (const x of [WIDTH - 115, WIDTH - 10]) { s.fill(x + 1, 49, 3, 4, c(29, 23, 10)); s.fill(x + 2, 48, 1, 6, c(20, 14, 4)); }
  return s.px;
}

function pause() {
  const s = surface(AREAS[1].scene, 0, [3]);
  for (let j = 0; j < HEIGHT; j++) s.math(0, j, WIDTH, 1, c(9 + Math.round((j / HEIGHT) * 7), 9 + Math.round((j / HEIGHT) * 7), 6 + Math.round((j / HEIGHT) * 5)), 'sub');
  const [X, Y, W, H] = [28, 18, 200, 188];
  s.math(X + 6, Y + 6, W, H, c(12, 12, 12), 'sub');
  s.math(X + 5, Y - 4, W, H, c(4, 10, 31), 'add', true);
  s.frame(X + 5, Y - 4, W, H, c(3, 5, 16), c(12, 16, 30), c(3, 5, 16));
  s.paper(X, Y, W, H);
  s.frame(X, Y, W, H, c(10, 8, 5), c(31, 31, 28), c(19, 16, 10));
  s.grad(X + 2, Y + 2, W - 4, 16, c(23, 21, 15), c(17, 15, 9));
  s.text('FORM 13-B', X + 8, Y + 6);
  s.text('HOLDINGS', X + W - 10 - measure('HOLDINGS'), Y + 6, RED);
  s.fill(X + 2, Y + 19, W - 4, 1, c(24, 6, 5)); s.fill(X + 2, Y + 21, W - 4, 1, c(24, 6, 5));
  s.text('ITEM', X + 16, Y + 26, RED); s.text('QTY', X + W - 32, Y + 26, RED);
  const rows = [['RED PENCIL', '1'], ['RUBBER STAMP', '1'], ['WATER COOLER JUG', '2'], ['SUBPOENA', '3']];
  rows.forEach(([name, n], i) => {
    const y = Y + 40 + i * 14;
    if (i === 1) s.math(X + 8, y - 3, W - 16, 13, c(0, 1, 12), 'sub');
    s.fill(X + 8, y + 10, W - 16, 1, c(18, 21, 27)); s.fill(X + 8, y + 11, W - 16, 1, c(31, 31, 30));
    s.text(name, X + 16, y); s.text(n, X + W - 28, y);
  });
  // Red pencil cursor, shaded.
  const py = Y + 40 + 14 + 1;
  s.fill(X + 4, py, 7, 5, c(24, 5, 4)); s.fill(X + 4, py, 7, 1, c(31, 14, 12)); s.fill(X + 4, py + 4, 7, 1, c(14, 2, 2));
  s.fill(X + 11, py, 2, 5, c(26, 21, 14)); s.fill(X + 13, py + 1, 1, 3, c(26, 21, 14)); s.fill(X + 14, py + 2, 1, 1, OUT);
  s.text('ATTACHMENTS', X + 16, Y + 102, RED);
  [[X + 16, true, 'HALO'], [X + 72, false, 'GARLIC']].forEach(([x, held, name]) => {
    const y = Y + 114;
    s.math(x + 2, y + 2, 30, 30, c(8, 8, 8), 'sub');
    if (held) { s.grad(x, y, 30, 30, c(31, 27, 10), c(18, 10, 1)); s.frame(x, y, 30, 30, OUT, c(31, 31, 22), c(13, 7, 1)); }
    else s.frame(x, y, 30, 30, c(12, 10, 6), c(31, 30, 26), c(18, 15, 9));
    s.grad(x + 3, y + 3, 24, 24, c(22, 20, 15), c(27, 25, 19));
    const [cx, cy] = [x + 15, y + 15];
    if (name === 'HALO') {
      for (let a = 0; a < Math.PI * 2; a += 0.03) {
        const i = Math.round(cx + Math.cos(a) * 9); const j = Math.round(cy + Math.sin(a) * 4);
        const t = (Math.sin(a) + 1) / 2;
        s.fill(i, j, 1, 1, mix(c(31, 30, 18), c(22, 14, 2), t)); s.fill(i, j + 1, 1, 1, mix(c(26, 19, 4), c(14, 8, 1), t));
      }
      s.math(cx - 11, cy - 6, 23, 13, c(3, 3, 0), 'add', false, (i, j) => ((i - cx) ** 2) / 121 + ((j - cy) ** 2) / 36 > 0.55);
    } else {
      for (let dy = -8; dy <= 8; dy++) for (let dx = -8; dx <= 8; dx++) {
        if ((dx * dx) / 49 + ((dy - 1) * (dy - 1)) / 56 > 1) continue;
        let col = mix(c(31, 31, 29), c(19, 18, 20), Math.max(0, Math.min(1, (dx + dy + 8) / 16)));
        if ((dx === -3 || dx === 0 || dx === 3) && Math.abs(dy - 1) < 6) col = mix(col, c(20, 16, 20), 0.5);
        s.fill(cx + dx, cy + dy, 1, 1, col);
      }
      s.fill(cx - 1, cy - 10, 2, 3, c(20, 22, 12));
    }
    s.text(name, x, y + 34);
  });
  s.text('WARDS OFF ONE BITE', X + 16, Y + 162);
  s.stamp('ON HOLD', X + 118, Y + 122);
  s.fill(X + 2, Y + 172, W - 4, 1, c(18, 21, 27));
  s.text('START: RESUME   B: FILE AWAY', X + 10, Y + 176);
  return s.px;
}

function select() {
  const s = surface(screens.title, 40);
  s.grad(0, 58, WIDTH, HEIGHT - 58, c(13, 8, 4), c(5, 3, 2));
  for (let j = 58; j < HEIGHT; j++) for (let i = 0; i < WIDTH; i++) if ((noise(i >> 5, j) % 11 === 0) && noise(i, j) % 3) s.math(i, j, 1, 1, c(2, 2, 1), 'sub');
  s.grad(0, 54, WIDTH, 5, c(16, 16, 19), c(6, 6, 8));
  for (const x of [84, 170]) s.grad(x, 0, 4, 56, c(14, 14, 17), c(7, 7, 9));
  s.grad(10, 66, 236, 154, c(6, 13, 9), c(2, 6, 4));
  s.frame(10, 66, 236, 154, c(4, 2, 1), c(10, 18, 13), c(1, 3, 2));
  s.math(62, 34, 132, 16, c(12, 12, 12), 'sub');
  const head = 'PERSONNEL FILES';
  s.gtext(head, (WIDTH - measure(head)) >> 1, 38, c(31, 31, 31), c(20, 22, 30));
  [['WARD', 16, true, 'BY THE BOOK'], ['MERCER', 134, false, 'OFF BOOK']].forEach(([name, x, on, line]) => {
    const y = 82; const w = 106; const h = 122;
    s.math(x + 4, y - 10, w, h + 14, c(10, 10, 10), 'sub');
    s.paper(x + 8, y - 16, 56, 16, c(27, 21, 11), c(24, 18, 9));
    s.frame(x + 8, y - 16, 56, 16, c(12, 8, 3), c(31, 27, 18), c(18, 13, 5));
    s.text(name, x + 13, y - 12);
    s.paper(x + 5, y - 3, w - 10, 6, c(30, 30, 28), c(28, 27, 24));
    s.paper(x, y, w, h, c(28, 23, 13), c(22, 16, 7));
    s.frame(x, y, w, h, c(12, 8, 3), c(31, 27, 18), c(17, 12, 4));
    s.grad(x + w - 18, y - 5, 4, 14, c(29, 29, 31), c(12, 12, 15)); s.fill(x + w - 17, y - 3, 2, 9, c(20, 20, 23));
    s.grad(x + 7, y + 8, 34, 42, c(17, 18, 21), c(9, 10, 13));
    s.frame(x + 6, y + 7, 36, 44, OUT, c(24, 24, 26), c(6, 6, 8));
    s.bust(x + 12, y + 18);
    s.text('GRADE 7', x + 46, y + 11); s.text('SENIOR', x + 46, y + 23); s.text('AUDITOR', x + 46, y + 35);
    s.text(line, x + 7, y + 58);
    for (let i = 0; i < 4; i++) { s.fill(x + 6, y + 70 + i * 10, w - 12, 1, c(19, 14, 7)); s.fill(x + 6, y + 71 + i * 10, w - 12, 1, c(31, 27, 17)); }
    if (on) {
      s.stamp('APPROVED', x + 20, y + 94);
      for (let j = 60; j < y + h + 6; j++) {
        const spread = Math.round(((j - 60) / (y + h - 54)) * 26);
        s.math(x - spread + 18, j, w - 36 + spread * 2, 1, c(4, 3, 1), 'add');
      }
    } else {
      s.math(x, y - 16, w, h + 16, c(13, 13, 11), 'sub');
    }
  });
  const prompt = 'A: SIGN OUT FILE';
  s.gtext(prompt, (WIDTH - measure(prompt)) >> 1, 209, c(31, 31, 31), c(20, 22, 30));
  return s.px;
}

const MOCKS = [['HUD in play', hud], ['Pause and inventory as an audit form', pause], ['Select as personnel files', select]];
const only = new URLSearchParams(location.search).get('only');
MOCKS.forEach(([title, draw], i) => {
  if (only != null && Number(only) !== i) return;
  const px = draw();
  const canvas = document.createElement('canvas');
  canvas.width = WIDTH; canvas.height = HEIGHT;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(WIDTH, HEIGHT);
  px.forEach((col, k) => { const [r, g, b] = rgb(col); img.data.set([r, g, b, 255], k * 4); });
  ctx.putImageData(img, 0, 0);
  const fig = document.createElement('figure');
  fig.id = `m${i}`;
  const cap = document.createElement('figcaption');
  cap.textContent = `${title}: ${new Set(px).size} colours`;
  fig.append(canvas, cap);
  document.body.append(fig);
});
</script>
