<!doctype html>
<meta charset="utf-8">
<title>Final Notice SNES: title concepts</title>
<style>
  body { background: #111; color: #ddd; font: 12px/1.35 monospace; margin: 16px; }
  h2 { color: #f5d38a; margin: 18px 0 8px; font-size: 14px; }
  section { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px; background: #1a1a1a; }
  figure { margin: 0; width: 512px; }
  canvas { width: 512px; height: 448px; image-rendering: pixelated; display: block; }
  figcaption { padding: 4px 2px; white-space: pre-wrap; }
  figcaption b { color: #f5d38a; }
</style>
<div id="boards"></div>
<div id="done"></div>
<script type="module">
import { WIDTH, HEIGHT } from '../../src/snes/screen.mjs';
import { rgb15, channels } from '../../src/snes/color.mjs';
import { screen, brightnessPass, mosaicPass, mathPass, mode7Pass, mode7Matrix, windowPass, toRgba } from '../../src/snes/fx.mjs';
import { drawString, measure } from '../../src/snes/text.mjs';

const CLEAR = 0xffff;
const filler = (buf, w = WIDTH, h = HEIGHT) => (x, y, rw, rh, c) => {
  for (let j = Math.max(0, y); j < Math.min(h, y + rh); j++) for (let i = Math.max(0, x); i < Math.min(w, x + rw); i++) buf[j * w + i] = c;
};
const mix = (a, b, t) => rgb15(...channels(a).map((v, i) => Math.round(v + (channels(b)[i] - v) * t)));
const grad = (f, x, y, w, h, top, bottom) => { for (let i = 0; i < h; i++) f(x, y + i, w, 1, mix(top, bottom, h > 1 ? i / (h - 1) : 0)); };
const centre = (s) => (WIDTH - measure(s)) >> 1;

const C = {
  night: rgb15(1, 1, 5), dusk: rgb15(7, 3, 10), bldg: rgb15(2, 2, 4), bldg2: rgb15(3, 3, 6),
  lit: rgb15(28, 24, 11), dim: rgb15(6, 6, 9), off: rgb15(3, 3, 6), ink: rgb15(3, 3, 6),
  red: rgb15(27, 4, 5), brass: rgb15(26, 20, 8), brassD: rgb15(12, 8, 3), paper: rgb15(28, 28, 23),
  glass: rgb15(14, 16, 14), glassD: rgb15(7, 9, 8), wood: rgb15(9, 6, 4), coat: rgb15(4, 4, 6),
  text: rgb15(31, 31, 31), ember: rgb15(31, 14, 4), marble: rgb15(20, 18, 22), marbleD: rgb15(8, 6, 12),
  sunTop: rgb15(10, 4, 16), sunMid: rgb15(28, 10, 14), sunLow: rgb15(31, 22, 10), chrome: rgb15(26, 28, 31), chromeD: rgb15(8, 10, 16),
};

// A logo texture for Mode 7: the word in the 8 px font, blown up by `px` so a scale of 1 reads as a logo.
function logoTex(word, colour, shade, px = 3) {
  const w0 = measure(word) + 2, h0 = 10;
  const small = new Uint16Array(w0 * h0).fill(CLEAR);
  drawString(filler(small, w0, h0), word, 1, 1, colour, shade);
  const w = w0 * px, h = h0 * px, out = new Uint16Array(w * h).fill(CLEAR);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = small[Math.floor(y / px) * w0 + Math.floor(x / px)];
    // top third of each letter a lighter band: a bevel in two palette entries
    out[y * w + x] = c === colour && (y % px) === 0 ? mix(colour, C.text, 0.45) : c;
  }
  return { w, h, px: out };
}

function stampTex(word, colour) {
  const w = measure(word) + 24, h = 28, px = new Uint16Array(w * h).fill(CLEAR), f = filler(px, w, h);
  f(0, 0, w, 3, colour); f(0, h - 3, w, 3, colour); f(0, 0, 3, h, colour); f(w - 3, 0, 3, h, colour);
  drawString(f, word, 12, 10, colour, null);
  return { w, h, px };
}

// The logo as a rubber stamp: the blown-up word inside a 3 px border.
function bigStamp(word, colour) {
  const t = logoTex(word, colour, null, 2), pad = 8, w = t.w + pad * 2, h = t.h + pad * 2;
  const px = new Uint16Array(w * h).fill(CLEAR), f = filler(px, w, h);
  f(0, 0, w, 3, colour); f(0, h - 3, w, 3, colour); f(0, 0, 3, h, colour); f(w - 3, 0, 3, h, colour);
  for (let y = 0; y < t.h; y++) for (let x = 0; x < t.w; x++) if (t.px[y * t.w + x] !== CLEAR) px[(y + pad) * w + x + pad] = colour;
  return { w, h, px };
}

function skyline(f, off = 0, base = 170) {
  grad(f, 0, 0, WIDTH, base, C.night, C.dusk);
  for (let i = 0; i < 14; i++) {
    const x = ((i * 23 + off) % 300) - 22, w = 16 + (i * 7) % 14, top = base - 30 - (i * 37) % 60;
    f(x, top, w, base - top, C.bldg2);
    for (let wy = top + 4; wy < base - 3; wy += 6) for (let wx = x + 3; wx < x + w - 3; wx += 4) if ((wx * 5 + wy * 3 + i) % 7 < 2) f(wx, wy, 2, 2, C.dim);
  }
  f(0, base, WIDTH, HEIGHT - base, C.bldg);
}

// The tower: floors above `outAbove` are dark, `lit` stays lit, the rest lit.
function tower(f, x, top, { lit = -1, outAbove = 99, w = 80 } = {}) {
  f(x - 1, top - 1, w + 2, HEIGHT - top + 1, 0);
  f(x, top, w, HEIGHT - top, C.bldg);
  for (let fl = 0, y = top + 6; y < HEIGHT; fl++, y += 9) {
    for (let wx = x + 4; wx < x + w - 4; wx += 6) {
      const on = fl === lit || fl >= outAbove;
      f(wx, y, 4, 4, on ? ((wx + fl) % 9 === 0 ? C.dim : C.lit) : C.off);
    }
  }
  f(x + (w >> 1) - 1, top - 16, 2, 16, 0);
}

function silhouette(f, x, feet, h, colour = C.coat, hat = false) {
  const head = Math.round(h * 0.16), w = Math.round(h * 0.36);
  f(x - (w >> 1), feet - h + head, w, h - head, colour);
  f(x - (w >> 1) - 2, feet - h + head + 4, w + 4, Math.round(h * 0.45), colour); // coat shoulders and skirt
  f(x - (head >> 2) - 3, feet - h, (head >> 1) + 6, head, colour);
  if (hat) f(x - (head >> 2) - 6, feet - h + 1, (head >> 1) + 12, 2, colour);
}

function prompt(f, word = 'PUSH START', y = 176) { drawString(f, word, centre(word), y); }

// ---- A. COLLECTIONS: the auditors behind frosted glass -----------------------------------
function glassDoor(f) {
  f(0, 0, WIDTH, HEIGHT, C.wood);
  grad(f, 40, 16, 176, 150, C.glass, C.glassD);
  f(36, 12, 184, 4, C.brassD); f(36, 166, 184, 4, C.brassD); f(36, 12, 4, 158, C.brassD); f(216, 12, 4, 158, C.brassD);
  f(0, 170, WIDTH, HEIGHT - 170, mix(C.wood, 0, 0.4));
  f(196, 176, 18, 6, C.brass);
}
const A = [
  { id: 'A1', t: '0:00-0:02', draw: (b) => { const f = filler(b); glassDoor(f); const lamp = screen(0); filler(lamp)(88, 40, 80, 90, rgb15(10, 8, 3)); return brightnessPass(mathPass(b, lamp, { op: 'add' }), 7); },
    cam: 'black; one desk lamp clicks on behind frosted glass (a warm pool, not the whole door)', sfx: 'a switch click, then a wall clock tick on the closed hat every half second', fx: 'fixed-colour add in a window for the lamp; INIDISP 0 to 7 in 14 frames' },
  { id: 'A2', t: '0:02-0:05', draw: (b) => { const f = filler(b); glassDoor(f); const lamp = screen(0); filler(lamp)(40, 16, 176, 150, rgb15(8, 6, 2)); const lit = mathPass(b, lamp, { op: 'add' }); const g = filler(lit); silhouette(g, 106, 166, 110, mix(C.glassD, 0, 0.5)); silhouette(g, 152, 166, 104, mix(C.glassD, 0, 0.5), true); return lit; },
    cam: 'two shadows rise into the glass as the auditors stand up behind it; they never turn to us', sfx: 'a low pad on the title chord; a chair creak', fx: 'shadows are a colour-subtract window per scanline (HDMA), so they soften at the glass edge' },
  { id: 'A3', t: '0:05-0:07', draw: (b) => { const f = filler(b); glassDoor(f); const g = f; silhouette(g, 106, 166, 110, mix(C.glassD, 0, 0.5)); silhouette(g, 152, 166, 104, mix(C.glassD, 0, 0.5), true); f(0, 0, WIDTH, HEIGHT, 0); f(0, 0, WIDTH, HEIGHT, mix(C.paper, 0, 0.2)); const out = mode7Pass(bigStamp('FINAL NOTICE', C.red), mode7Matrix(1, -0.05), [128, 96], b.slice()); return out; },
    cam: 'hard cut to a bill filling the screen; FINAL NOTICE stamps down at 180% and settles to 100% in 8 frames, 2 px shake', sfx: 'the stamp lands on the downbeat and the title theme\'s slap bass and gated snare enter', fx: 'Mode 7 scale on BG1 (stamp), sprites none; white flash one frame by fixed-colour add' },
  { id: 'A4', t: '0:07 on', draw: (b) => { const f = filler(b); glassDoor(f); silhouette(f, 106, 166, 110, mix(C.glassD, 0, 0.5)); silhouette(f, 152, 166, 104, mix(C.glassD, 0, 0.5), true); const out = mode7Pass(bigStamp('FINAL NOTICE', C.red), mode7Matrix(1.1, -0.05), [128, 56], b.slice()); const g = filler(out); g(150, 60, 2, 2, C.ember); drawString(g, 'AUDIT DIVISION', centre('AUDIT DIVISION'), 120, C.brass, C.brassD); prompt(g); return out; },
    cam: 'the bill slides up and becomes the lettering on the glass; the shadows wait; PUSH START blinks', sfx: 'title theme loops; every 8 bars the clock tick shows through a drum break', fx: 'idle: one shadow\'s cigarette ember is a 4-colour palette cycle; the lamp breathes by ±1 brightness' },
];

// ---- B. AFTER HOURS: the tower goes dark floor by floor (recommended) ---------------------
const B = [
  { id: 'B1', t: '0:00-0:02', draw: (b) => { const f = filler(b); skyline(f, 0); tower(f, 88, 34, { outAbove: 0 }); return brightnessPass(b, 10); },
    cam: 'fade up on the tower from the opening, every floor lit; the skyline behind drifts at half speed', sfx: 'the title theme\'s DX piano intro, four bars, nothing else', fx: 'BG1 tower, BG2 skyline parallax; HDMA sky gradient on the backdrop colour' },
  { id: 'B2', t: '0:02-0:05', draw: (b) => { const f = filler(b); skyline(f, 20); tower(f, 88, 34, { lit: 12, outAbove: 14 }); return b; },
    cam: 'the lights go out one floor a beat, top down, in time with the piano; one floor stays lit', sfx: 'a relay clunk per floor on the noise channel, on the beat', fx: 'lit windows are one palette entry per floor band: a palette write per beat, no tiles change' },
  { id: 'B3', t: '0:05-0:06', draw: (b) => { const f = filler(b); skyline(f, 30); tower(f, 88, 34, { lit: 12, outAbove: 99 }); const out = mode7Pass(logoTex('FINAL NOTICE', C.brass, C.brassD), mode7Matrix(1.6, 0), [128, 64], b.slice()); return mathPass(out, screen(rgb15(5, 5, 5)), { op: 'add' }); },
    cam: 'on the downbeat the last dark floor is reached and the logo presses toward us: 260% to 100% in 20 frames, no spin', sfx: 'a single low brass hit, then the sax takes the melody; the full band enters', fx: 'Mode 7 scale only on BG1; the backdrop brightens one frame by fixed-colour add' },
  { id: 'B4', t: '0:06 on', draw: (b) => { const f = filler(b); skyline(f, 40); tower(f, 88, 34, { lit: 12, outAbove: 99 }); const out = mode7Pass(logoTex('FINAL NOTICE', C.brass, C.brassD), mode7Matrix(0.9, 0), [128, 60], b.slice()); const g = filler(out); prompt(g); drawString(g, '(C)1995', 4, 212, C.dim, null); return out; },
    cam: 'settled: logo over the dark tower, the one lit floor under it; PUSH START blinks after a 1 s hold', sfx: 'title theme loops; after 20 s idle it fades and the attract loop starts', fx: 'idle: a glint crosses the logo every 6 s by palette cycle; the sky tint follows the real clock (dusk, night, pre-dawn)' },
];

// ---- C. QUARTERLY DUSK: corporate wave ----------------------------------------------------
function plaza(f, scroll = 0) {
  grad(f, 0, 0, WIDTH, 60, C.sunTop, C.sunMid);
  grad(f, 0, 60, WIDTH, 56, C.sunMid, C.sunLow);
  for (let i = 0; i < 6; i++) f(60, 76 + i * 7, 136, 2 + (i >> 1), C.sunTop);
  for (let i = 0; i < 10; i++) { const x = i * 28 - 8, top = 70 - (i * 13) % 30; f(x, top, 20, 116 - top, mix(C.sunTop, 0, 0.5)); }
}
function grid(buf, scroll, horizon = 116) {
  const f = filler(buf);
  for (let y = horizon; y < HEIGHT; y++) {
    const z = 400 / (y - horizon + 4);
    const band = Math.floor(z + scroll) % 2 === 0;
    f(0, y, WIDTH, 1, band ? C.marble : C.marbleD);
    for (let k = -8; k <= 8; k++) { const x = 128 + (k * 40 * (y - horizon + 4)) / 40; f(Math.round(x), y, 1, 1, C.chromeD); }
  }
}
const Cc = [
  { id: 'C1', t: '0:00-0:03', draw: (b) => { const f = filler(b); plaza(f); grid(b, 0.3); return brightnessPass(b, 9); },
    cam: 'a marble plaza floor rushes toward us under a sunset over glass towers', sfx: 'gated pad swell, a reversed cymbal', fx: 'Mode 7 perspective floor (HDMA per-line matrix) under a BG2 sky; sky gradient by HDMA' },
  { id: 'C2', t: '0:03-0:05', draw: (b) => { const f = filler(b); plaza(f); grid(b, 1.1); const out = mode7Pass(logoTex('FINAL NOTICE', C.chrome, C.chromeD), mode7Matrix(1.3, 0, 3), [128, 50], b.slice()); return out; },
    cam: 'chrome logo drops from above the horizon, squashed tall to normal', sfx: 'orchestra hit on the downbeat, slap bass and four-on-the-floor kick', fx: 'on a Mode 7 frame the logo must be sprites (BG1 is the floor): 16x16 OBJ tiles, one 15-colour palette' },
  { id: 'C3', t: '0:05-0:07', draw: (b) => { const f = filler(b); plaza(f); grid(b, 1.7); const out = mode7Pass(logoTex('FINAL NOTICE', C.chrome, C.chromeD), mode7Matrix(0.9, 0), [128, 50], b.slice()); const g = filler(out); g(60, 38, 3, 26, C.text); g(64, 38, 1, 26, C.text); return out; },
    cam: 'a shine sweeps the chrome left to right; the floor slows', sfx: 'sax melody enters', fx: 'shine is a palette cycle across 6 entries of the logo palette' },
  { id: 'C4', t: '0:07 on', draw: (b) => { const f = filler(b); plaza(f); grid(b, 2.0); const out = mode7Pass(logoTex('FINAL NOTICE', C.chrome, C.chromeD), mode7Matrix(0.9, 0), [128, 50], b.slice()); const g = filler(out); drawString(g, 'A HOSTILE TAKEOVER OF THE AFTERLIFE', centre('A HOSTILE TAKEOVER OF THE AFTERLIFE'), 72, C.sunLow, C.sunTop); prompt(g, 'PRESS START', 170); return out; },
    cam: 'settled; tag line; PRESS START', sfx: 'title theme loops', fx: 'floor idles at 1 px a frame; risk: reads as Outrun, brighter and more cartoony than the late-1995 grounded look' },
];

const BOARDS = [
  { scene: 'A. COLLECTIONS (underworld auditors): shadows behind frosted glass, the logo is a stamp', boards: A },
  { scene: 'B. AFTER HOURS (late-80s corporate office): the tower goes dark floor by floor  RECOMMENDED', boards: B },
  { scene: 'C. QUARTERLY DUSK (corporate wave): chrome logo over a Mode 7 marble plaza', boards: Cc },
];

const root = document.getElementById('boards');
for (const [n, group] of BOARDS.entries()) {
  const wrap = document.createElement('div'); wrap.id = `g${n}`; root.append(wrap);
  const h = document.createElement('h2'); h.textContent = group.scene; wrap.append(h);
  const sec = document.createElement('section'); wrap.append(sec);
  for (const bd of group.boards) {
    const fig = document.createElement('figure');
    const cv = document.createElement('canvas'); cv.width = WIDTH; cv.height = HEIGHT;
    const out = bd.draw(screen(0));
    cv.getContext('2d').putImageData(new ImageData(toRgba(out), WIDTH, HEIGHT), 0, 0);
    const cap = document.createElement('figcaption');
    cap.innerHTML = `<b>${bd.id}  ${bd.t}</b>\nCAMERA ${bd.cam}\nSOUND  ${bd.sfx}\nSNES   ${bd.fx}`;
    fig.append(cv, cap); sec.append(fig);
  }
}
document.getElementById('done').textContent = 'boards ready';
</script>
